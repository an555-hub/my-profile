<title>Aimy デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?%%FONTS%%&display=swap">
<style>
:root{
  --bg:#f3f5f5; --card:#ffffff; --ink:#1c1f21; --muted:#5b6266; --line:#dfe3e4; --accent:#0d6b78;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1112; --card:#1a1e1f; --ink:#eceeee; --muted:#a3abae; --line:#2c3235; --accent:#6cc3cf; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0e1112; --card:#1a1e1f; --ink:#eceeee; --muted:#a3abae; --line:#2c3235; --accent:#6cc3cf; color-scheme:dark;}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.75}
.top{max-width:1180px;margin-inline:auto;padding:28px 16px 20px;display:flex;flex-direction:column;gap:18px}
.top h1{font-size:24px;margin:0;text-wrap:balance}
.top p{margin:0;color:var(--muted)}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.how b{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-height:48px}
.pick:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pick .lab{display:flex;align-items:baseline;gap:10px}
.pick .lab b{font-size:20px}
.pick .lab span{color:var(--muted)}
.pick .state{font-size:13px;color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pick[aria-pressed="true"] .state{color:var(--ink);font-weight:700}
.pick ul{margin:0;padding-left:1.2em}
.link{font-size:12px;color:var(--muted);word-break:break-all;user-select:all}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line)}
.bar-in{max-width:1180px;margin-inline:auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar-in span{color:var(--muted);font-size:13px;margin-right:4px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;min-width:64px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-align:center;font-weight:500}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{border-bottom:1px solid var(--line)}
.note{max-width:1180px;margin-inline:auto;padding:20px 16px 48px;color:var(--muted);font-size:13px}
%%DESIGN_CSS%%
</style>

<header class="top">
  <h1>Aimy さんの自己紹介サイト　デザイン案</h1>
  <p>3案とも中身の文章は同じで、見た目だけが違います。どの案もまだ選ばれていません。下のボタンで、表示する案を切り替えられます（切り替えても「選んだ」ことにはなりません）。</p>
  <div class="how">気に入った案が決まったら、<b>この会話に短く返信</b>してください。例：「案Bで、文字を大きく」</div>
  <div class="cards">
    <button class="pick" type="button" data-show="a" aria-pressed="false">
      <span class="lab"><b>案A</b><span>余白</span></span>
      <ul><li>白地に文字だけの、いちばん静かな案</li><li>英語は細い斜体。名前の横の ✱ がゆっくり回る</li></ul>
      <span class="state">タップで表示</span>
    </button>
    <button class="pick" type="button" data-show="b" aria-pressed="false">
      <span class="lab"><b>案B</b><span>旅程</span></span>
      <ul><li>旅のチケットや行程表がヒント</li><li>経歴は点線の道のり、連絡先は搭乗券風。差し色は深い青</li></ul>
      <span class="state">タップで表示</span>
    </button>
    <button class="pick" type="button" data-show="c" aria-pressed="false">
      <span class="lab"><b>案C</b><span>二つの視点</span></span>
      <ul><li>「GLOBAL × LOCAL」が主役</li><li>明朝体で上品に。名前の下に手書き風の線。差し色は落ち着いた緑</li></ul>
      <span class="state">タップで表示</span>
    </button>
  </div>
</header>

<nav class="bar" aria-label="案の切り替え">
  <div class="bar-in" role="tablist">
    <span>表示中：</span>
    <button class="tab" type="button" role="tab" data-show="a" aria-selected="false">案A</button>
    <button class="tab" type="button" role="tab" data-show="b" aria-selected="false">案B</button>
    <button class="tab" type="button" role="tab" data-show="c" aria-selected="false">案C</button>
  </div>
</nav>

<div class="stage">
%%DESIGNS%%
</div>

<p class="note">画像はまだ入れていません（未定）。メールのボタンが反応しないときは、下に表示しているアドレスをコピーして使えます。</p>

<script>
(function(){
  var keys=['a','b','c'];
  function show(k, scroll){
    if(keys.indexOf(k)<0) k='a';
    keys.forEach(function(x){ document.getElementById('view-'+x).hidden = (x!==k); });
    document.querySelectorAll('[data-show]').forEach(function(el){
      var on = el.getAttribute('data-show')===k;
      if(el.classList.contains('tab')) el.setAttribute('aria-selected', on);
      else { el.setAttribute('aria-pressed', on); el.querySelector('.state').textContent = on ? '表示中' : 'タップで表示'; }
    });
    if(scroll){ document.querySelector('.bar').scrollIntoView({behavior:'smooth'}); }
  }
  document.querySelectorAll('[data-show]').forEach(function(el){
    el.addEventListener('click', function(){ show(el.getAttribute('data-show'), true); });
  });
  var h=(location.hash||'').replace('#','');
  show(h, keys.indexOf(h)>=0);
})();
</script>
